services:
  # ==========================================
  # 1. USER & AUTHENTICATION SERVICE (:8081)
  # ==========================================
  - type: web
    name: ofia-service-users
    env: go
    plan: starter
    region: frankfurt
    rootDir: service_users
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8081"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "mysql://u721451974_nexa:*Reedb4b4@srv2113.hstgr.io:3306/u721451974_nexa_db"
      - key: JWT_SECRET
        value: "nexa-jwt-secret-key-production-2026"
      - key: ENV
        value: "production"

