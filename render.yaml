services:
  - type: web
    name: nexa-marketplace-service
    env: go
    plan: free
    region: frankfurt
    rootDir: marketplace_service
    buildCommand: go build -o server main.go
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8085"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "mysql://u721451974_nexa:*Reedb4b4@srv2113.hstgr.io:3306/u721451974_nexa_db"
      - key: JWT_SECRET
        value: "nexa-jwt-secret-key-production-2026"
      - key: ENV
        value: "production"

